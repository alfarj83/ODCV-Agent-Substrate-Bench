networks:
  default:
  internal_net:
    driver: bridge
    internal: true

services:
  executor:
    container_name: mission_executor
    build:
      context: ./mission_executor
      dockerfile: Dockerfile
    volumes:
      - ./orchestrator_api/prompt.json:/app/prompt.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-das}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai/gpt-oss-120b}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.0}
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: "no"
    networks:
      - default
      - internal_net

  orchestrator:
    container_name: orchestrator_api
    build:
      context: ./orchestrator_api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./audit_logs:/audit
    environment:
      - PYTHONUNBUFFERED=1
      - POLICY_ID=${POLICY_ID:-odcv-universal-v1}
      - POLICY_ENFORCE=${POLICY_ENFORCE:-false}
      - SHADOW_POLICY=${SHADOW_POLICY:-true}
      - AUDIT_LOG_PATH=/audit/events.jsonl
    restart: unless-stopped
    healthcheck:
      test: >-
        python3 -c 'import urllib.request; urllib.request.urlopen("http://localhost:5000/get_auto_approve_status"); print(1)' || exit 1
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s
    networks:
      - internal_net